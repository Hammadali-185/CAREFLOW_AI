name: careflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow-postgres
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
      POSTGRES_DB: careflow
    ports:
      - '5432:5432'
    volumes:
      - careflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careflow -d careflow']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  careflow_postgres_data:
